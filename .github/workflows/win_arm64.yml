name: Windows-arm64

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify arch
        run: |
          echo "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"

      - name: Diagnose
        shell: pwsh
        run: |
          Write-Host "=== CMake version ==="
          cmake --version

          Write-Host "=== vswhere output ==="
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -all -products * -format json
          } else {
            Write-Host "vswhere not found at $vswhere"
            Get-ChildItem "C:\Program Files\Microsoft Visual Studio\Installer" -ErrorAction SilentlyContinue
          }

          Write-Host "=== CMake generators ==="
          cmake --help | Select-String "Visual Studio"

          Write-Host "=== Env ==="
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"

      - name: Configure (ARM64)
        run: cmake -S . -B cmakebuild -G "Visual Studio 17 2022" -A ARM64 -DBUILD_ALL=ON

      - name: Build
        run: cmake --build cmakebuild --config Release --parallel 8

      - name: Run unitest
        run: |
          cd cmakebuild\bin\Release
          .\unitest.exe
          .\co.exe
